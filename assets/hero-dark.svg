<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title description">
  <title id="title">Mubai — Ideas, made useful.</title>
  <desc id="description">Minimal editorial banner about AI agents, knowledge systems and useful tools.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1829"/>
      <stop offset="100%" stop-color="#18283A"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#334358" stroke-width="1"/>
    </pattern>
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6FA8BB"/>
      <stop offset="100%" stop-color="#FFB878"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="19" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
    <clipPath id="rounded"><rect x="1" y="1" width="1198" height="368" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#rounded)">
    <rect x="1" y="1" width="1198" height="368" fill="url(#background)"/>
    <rect x="1" y="1" width="1198" height="368" fill="url(#grid)" opacity="0.22"/>
    <circle cx="1110" cy="-32" r="295" fill="#6FA8BB" opacity="0.09"/>
    <circle cx="691" cy="434" r="210" fill="#FFB878" opacity="0.075"/>
    <path d="M735 29V341" stroke="#304357" stroke-width="1" stroke-dasharray="3 10"/>

    <rect x="68" y="57" width="44" height="44" rx="13" fill="#F5F7F8"/>
    <path d="M80 89V70L90 81L100 70V89" fill="none" stroke="#0F1829" stroke-width="4" stroke-linecap="square"/>
    <circle cx="112" cy="59" r="6" fill="#FFB878"/>
    <text x="128" y="85" fill="#C1CFD7" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">MUBAI / PERSONAL LAB</text>

    <text x="67" y="188" fill="#F5F7F8" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="65" font-weight="750" letter-spacing="-2.6">Ideas, made useful.</text>
    <text x="69" y="235" fill="#C1CFD7" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="450">AI agents / Knowledge systems / Useful tools</text>

    <rect x="68" y="289" width="38" height="4" rx="2" fill="#FFB878"/>
    <text x="123" y="297" fill="#9CB0BE" font-family="Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="2.1">STAY CURIOUS, GROW SLOWLY</text>

    <g filter="url(#softShadow)">
      <rect x="772" y="53" width="362" height="264" rx="20" fill="#1B2C40" stroke="#42576C" stroke-width="1.3"/>
    </g>
    <circle cx="805" cy="84" r="5" fill="#FFB878"/>
    <circle cx="824" cy="84" r="5" fill="#627A92" opacity="0.8"/>
    <circle cx="843" cy="84" r="5" fill="#627A92" opacity="0.55"/>
    <text x="880" y="90" fill="#9CB0BE" font-family="Inter,system-ui,Arial,sans-serif" font-size="16" font-weight="600">the way I build</text>
    <path d="M794 111H1112" stroke="#42576C" stroke-width="1"/>

    <path d="M832 180L934 148L1057 199" fill="none" stroke="url(#trace)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M831 180C874 240 986 258 1057 199" fill="none" stroke="#7690A6" opacity="0.36" stroke-width="1.5" stroke-dasharray="5 7"/>
    <circle cx="832" cy="180" r="25" fill="#152438" stroke="#6FA8BB" stroke-width="2"/>
    <circle cx="934" cy="148" r="25" fill="#152438" stroke="#FFB878" stroke-width="2"/>
    <circle cx="1057" cy="199" r="25" fill="#152438" stroke="#6FA8BB" stroke-width="2"/>
    <text x="832" y="187" fill="#F5F7F8" text-anchor="middle" font-family="Inter,system-ui,Arial,sans-serif" font-size="18" font-weight="700">01</text>
    <text x="934" y="155" fill="#F5F7F8" text-anchor="middle" font-family="Inter,system-ui,Arial,sans-serif" font-size="18" font-weight="700">02</text>
    <text x="1057" y="206" fill="#F5F7F8" text-anchor="middle" font-family="Inter,system-ui,Arial,sans-serif" font-size="18" font-weight="700">03</text>
    <text x="832" y="225" fill="#9CB0BE" text-anchor="middle" font-family="Inter,system-ui,Arial,sans-serif" font-size="13" font-weight="650" letter-spacing="1.1">DISCOVER</text>
    <text x="934" y="195" fill="#9CB0BE" text-anchor="middle" font-family="Inter,system-ui,Arial,sans-serif" font-size="13" font-weight="650" letter-spacing="1.1">DESIGN</text>
    <text x="1057" y="244" fill="#9CB0BE" text-anchor="middle" font-family="Inter,system-ui,Arial,sans-serif" font-size="13" font-weight="650" letter-spacing="1.1">DELIVER</text>
    <rect x="802" y="269" width="302" height="29" rx="9" fill="#294157"/>
    <text x="953" y="289" fill="#C1CFD7" text-anchor="middle" font-family="Inter,system-ui,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing=".3">clarity  /  systems  /  action</text>
  </g>
  <rect x="1" y="1" width="1198" height="368" rx="26" fill="none" stroke="#304357" stroke-width="2"/>
</svg>